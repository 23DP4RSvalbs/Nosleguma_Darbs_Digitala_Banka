<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bezsaistes rezims</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(145deg, #e2e8f0, #f8fafc);
        color: #0f172a;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 520px;
        margin: 24px;
        padding: 32px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #cbd5e1;
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.55rem;
      }

      p {
        margin: 0;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sobrid nav interneta savienojuma</h1>
      <p>
        Aplikacija turpina darboties bezsaistes rezima ar ierobezotu funkcionalitati.
        Kad savienojums atjaunosies, ieladejiet lapu no jauna.
      </p>
    </main>
  </body>
</html>
