version: '3.8'
services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/database:/var/www/database
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    ports:
      - "8000:8000"
    # On first start: generate key, migrate and seed once, then serve. Uses /var/www/.initialized file to avoid reseeding.
    command: sh -c "if [ ! -f /var/www/.initialized ]; then php artisan key:generate --force || true; php artisan migrate --force; php artisan db:seed --class=DatabaseSeeder --force; touch /var/www/.initialized; fi; php artisan serve --host=0.0.0.0 --port=8000"

  web:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: busybox
    volumes:
      - ./backend/database:/var/www/database
    command: /bin/sh -c "sleep infinity"

# Note: This compose file expects a simple Nginx config at ./nginx/default.conf and a built frontend in frontend/dist.
